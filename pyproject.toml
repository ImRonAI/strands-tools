[project]
name = "strands-tools-fastmcp"
version = "0.1.0"
description = "Unified Strands Tools FastMCP Server, Client (with REA MCP Proxy), and FastMCP Generative UI Application"
requires-python = ">=3.12"
dependencies = [
    "fastmcp[apps,code-mode,tasks]==4.1.0",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "prefab-ui==0.20.2",
    "httpx2==2.13.1",
    "fastmcp-tasks==4.1.0",
    "py-key-value-aio[filetree,redis,wrappers-encryption]==0.4.6",
    "deno==2.9.7",
    "strands-agents>=1.50.0",
    "google-genai>=2.0.0",
    "pydantic-monty>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "ccxt>=4.0.0",
    "utcp>=1.0.0",
    "utcp-http>=1.0.0",
    "youtube-transcript-api>=0.6.2",
    "openpyxl>=3.1.0",
    "rank-bm25>=0.2.2",
    "qrcode>=7.4.0",
    "pyperclip>=1.8.0",
    "jinja2>=3.1.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "src/tools", "packages/server/src", "packages/client/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "src/tools", "packages/server/src", "packages/client/src"]
testpaths = ["tests", "packages/server/tests", "packages/client/tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src/tools", "src", "packages/server/src", "packages/client/src"]

